services:
  # Backend Web Service
  - type: web
    name: url-safety-checker-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard

  # Frontend Static Site
  - type: web
    name: url-safety-checker-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: url-safety-checker-backend
          property: host
